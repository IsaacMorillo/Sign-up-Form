<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up for Olympus</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="title-container">
      <h1>Welcome to Olympus</h1>
      <p>
        Imagen de
        <a
          href="https://pixabay.com/es/users/mythologyart-34077399/?utm_source=link-attribution&utm_medium=referral&utm_campaign=image&utm_content=8546415"
          >MythologyArt</a
        >
        en
        <a
          href="https://pixabay.com/es//?utm_source=link-attribution&utm_medium=referral&utm_campaign=image&utm_content=8546415"
          >Pixabay</a
        >
      </p>
    </div>
    <div class="form-container">
      <div class="info">
        <p>
          This form is for submitting a request to enter Olympus and live among
          the gods.
        </p>
        <p>Register if you feel you are worthy</p>
      </div>
      <form action="" method="post">
        <h2>Let's do this!</h2>
        <fieldset>
          <div class="field">
            <label for="user-name">First Name</label>
            <input
              type="text"
              id="name"
              name="user-name"
              required
              minlength="3"
            />
          </div>
          <div class="field">
            <label for="user-last_name">Last Name</label>
            <input
              type="text"
              id="last-name"
              name="user-last-name"
              minlength="3"
            />
          </div>
          <div class="field">
            <label for="user-email">Email</label>
            <input type="email" id="email" name="user-email" required />
          </div>
          <div class="field">
            <label for="user-number">Phone Number</label>
            <input
              type="tel"
              maxlength="10"
              minlength="10"
              id="number"
              name="user-number"
              required
            />
          </div>
          <div class="field">
            <label for="user-password">Password</label>
            <input
              type="password"
              minlength="8"
              id="password"
              name="user-password"
              required
            />
          </div>
          <div class="field">
            <label for="user-conf-password">Confirm Password</label>
            <input
              type="password"
              minlength="8"
              id="confirm-password"
              name="user-conf-password"
              required
            />
          </div>
        </fieldset>
        <button type="submit">Create Account</button>
        <p class="log-in">Already have an account? <a href="">Log in</a></p>
      </form>
    </div>
  </body>
</html>
