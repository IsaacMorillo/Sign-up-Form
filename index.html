<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up for Olympus</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div>
      <h1>Welcome to Olympus</h1>
    </div>
    <div>
      <p>
        This form is for submitting a request to enter Olympus and live among
        the gods.
      </p>
      <p>Register if you feel you are worthy</p>
      <form action="" method="post">
        <fieldset>
          <h2>Let's do this!</h2>
          <div>
            <label for="user-name">First Name</label>
            <input type="text" id="name" name="user-name" required />
          </div>
          <div>
            <label for="user-last_name">Last Name</label>
            <input type="text" id="last-name" name="user-last-name" />
          </div>
          <div>
            <label for="user-email">Email</label>
            <input type="email" id="email" name="user-email" required />
          </div>
          <div>
            <label for="user-number">Phone Number</label>
            <input
              type="text"
              maxlength="10"
              minlength="10"
              id="number"
              name="user-number"
            />
          </div>
          <div>
            <label for="user-password">Password</label>
            <input
              type="password"
              minlength="8"
              id="password"
              name="user-password"
            />
          </div>
          <div>
            <label for="user-conf-password">Confirm Password</label>
            <input
              type="password"
              minlength="8"
              id="confirm-password"
              name="user-conf-password"
            />
          </div>
        </fieldset>
        <button type="submit">Create Account</button>
        <p>Already have an account? <a href="">Log in</a></p>
      </form>
    </div>
  </body>
</html>
